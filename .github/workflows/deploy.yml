name: Deploy Wedding Website to S3

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{"{{"}} secrets.AWS_ACCESS_KEY_ID {{"}}"}}
          aws-secret-access-key: ${{"{{"}} secrets.AWS_SECRET_ACCESS_KEY {{"}}"}}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://wedding-template-static-hosting-20261016190256 \
            --exclude "*" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".terraform/*" \
            --exclude "terraform.tfstate" \
            --exclude "terraform.tfstate.backup" \
            --exclude "*.tf" \
            --exclude "*.tfvars" \
            --include "index.html" \
            --include "css/*" \
            --include "js/*" \
            --include "img/*" \
            --include "lib/*" \
            --include "scss/*" \
            --include "*.jpg"